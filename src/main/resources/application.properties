spring.application.name=UserManagement

spring.datasource.url=jdbc:postgresql://localhost:5432/Users
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.test.mockbean.replace-with-mock.enabled=true
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm

server.port=8083
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

jwt.secret=${JWT_SECRET:YWlycG9ydHMtdXNlcm1hbmFnZW1lbnQtand0LXNlY3JldC1rZXktMzJieXRlcyE=}
jwt.expiration=3600000