<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

  <h1>All Users</h1>

  <table>
    <thead>
    <tr>
      <th>User ID</th>
      <th>Username</th>
      <th>Full Name</th>
      <th>Role</th>
      <th>Status</th>
      <th>Created Date</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="user : ${users}">
      <td th:text="${user.id}">
        N/A
      </td>

      <td th:text="${user.username}">
        N/A
      </td>

      <td th:text="${(user.firstName != null ? user.firstName : '') + ' ' +
                          (user.lastName != null ? user.lastName : '')}">
      </td>

      <td th:text="${user.role}">
        N/A
      </td>

      <td th:text="${user.status}">
        N/A
      </td>

      <td th:text="${user.createdDate != null ? user.createdDate : 'N/A'}">
        N/A
      </td>

      <td th:if="${adminView}">
        <a th:href="@{/admin/users/username/{username}(username=${user.username})}"
           class="btn btn-primary">
          View
        </a>

        <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
           class="btn btn-success">
          Edit
        </a>

        <form th:action="@{/admin/users/delete/{id}(id=${user.id})}"
              method="post"
              style="display:inline;">

          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

          <button type="submit"
                  class="btn btn-danger">
            Delete
          </button>

        </form>

      </td>

    </tr>
    </tbody>
  </table>

  <th:block sec:authorize="hasRole('ADMIN')">
    <br>
    <a th:href="@{/admin/users/new}"
       class="btn btn-success">
      Create New User
    </a>
  </th:block>

</div>
</body>
</html>
